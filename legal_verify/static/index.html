<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법률 AI 답변 검증기</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c1f24; --muted: #6b7280; --border: #e3e6ea;
    --accent: #2f5fd6; --green: #1d8a4e; --yellow: #b7791f; --red: #c53030;
    --green-bg: #e6f6ec; --yellow-bg: #fdf3e0; --red-bg: #fde8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1b1e26; --text: #e7e9ee; --muted: #9aa3b2; --border: #2b303b;
      --accent: #7ea2ff; --green: #5cd08a; --yellow: #f0b25a; --red: #ff7b7b;
      --green-bg: #17301f; --yellow-bg: #3a2c12; --red-bg: #3a1a1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab { background: none; border: none; padding: 10px 14px; cursor: pointer; color: var(--muted); font-size: .95rem; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 12px 0 6px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea.tall { min-height: 160px; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button.primary { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: .95rem; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: .85rem; }
  #progress { display: none; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .steps li { display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .steps li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex: none; }
  .steps li.active { color: var(--text); }
  .steps li.active .dot { background: var(--accent); animation: pulse 1s infinite; }
  .steps li.done { color: var(--text); }
  .steps li.done .dot { background: var(--green); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  #result { display: none; }
  .grade { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 700; letter-spacing: .02em; }
  .grade.PASS { background: var(--green-bg); color: var(--green); }
  .grade.CAUTION { background: var(--yellow-bg); color: var(--yellow); }
  .grade.FAIL { background: var(--red-bg); color: var(--red); }
  .answer { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 14px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .92rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
  .badge.verified { background: var(--green-bg); color: var(--green); }
  .badge.unsupported { background: var(--yellow-bg); color: var(--yellow); }
  .badge.contradicted, .badge.fabricated { background: var(--red-bg); color: var(--red); }
  .badge.review { background: var(--yellow-bg); color: var(--yellow); }
  .badge.auto { background: var(--bg); color: var(--muted); }
  .cite { color: var(--muted); font-size: .85rem; }
  .cite a { color: var(--accent); text-decoration: none; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
  .metric { background: var(--bg); border-radius: 8px; padding: 12px; }
  .metric .k { color: var(--muted); font-size: .82rem; }
  .metric .v { font-size: 1.25rem; font-weight: 600; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { overflow: auto; background: var(--bg); padding: 12px; border-radius: 8px; font-size: .8rem; }
  .error { color: var(--red); background: var(--red-bg); padding: 12px; border-radius: 8px; display: none; }
  @media (max-width: 640px) { th:nth-child(5), td:nth-child(5) { display: none; } }
</style>
</head>
<body>
<main>
  <h1>법률 AI 답변 검증기</h1>
  <p class="sub">AI가 낸 법률 답변의 주장을 실제 법령 조문과 대조해 Jev가 검증합니다. 법률 자문이 아닌 참고 정보입니다.</p>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="generate" role="tab">질문하기</button>
      <button class="tab" data-mode="extract" role="tab">답변 검토</button>
    </div>
    <form id="form">
      <label for="question">법률 질문</label>
      <textarea id="question" placeholder="예: 1년 근무한 직원의 연차휴가는 며칠인가요?" required></textarea>
      <div id="answerWrap" hidden>
        <label for="answerText">검토할 AI 답변 원문</label>
        <textarea id="answerText" class="tall" placeholder="다른 AI에게서 받은 답변을 그대로 붙여 넣으세요."></textarea>
      </div>
      <div class="row">
        <button class="primary" id="submit" type="submit">검증 시작</button>
        <span class="hint" id="modeHint">GPT가 답변을 생성한 뒤, 인용 조문을 조회해 Jev로 검증합니다.</span>
      </div>
    </form>
  </section>

  <section class="card" id="progress">
    <ul class="steps">
      <li data-step="generate"><span class="dot"></span><span class="label">답변 준비</span></li>
      <li data-step="fetch"><span class="dot"></span><span class="label">인용 조문 조회</span></li>
      <li data-step="judge"><span class="dot"></span><span class="label">Jev 검증</span></li>
    </ul>
  </section>

  <div class="error card" id="error"></div>

  <section class="card" id="result">
    <div class="row" style="margin-top:0; justify-content: space-between;">
      <h2 style="margin:0; font-size:1.1rem;">검증 결과</h2>
      <span class="grade" id="grade"></span>
    </div>
    <label>질문</label>
    <div id="rQuestion"></div>
    <label>AI 답변</label>
    <div class="answer" id="rAnswer"></div>
    <label>주장별 검증</label>
    <table>
      <thead><tr><th>#</th><th>주장</th><th>인용 조문</th><th>판정</th><th>신뢰도</th><th>과잉단정</th><th>처리</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="metrics">
      <div class="metric"><div class="k">질문 응답도 (0~3)</div><div class="v" id="mAnswered"></div></div>
      <div class="metric"><div class="k">확정적 조언 어조 확률</div><div class="v" id="mTone"></div></div>
      <div class="metric"><div class="k">사람 검토 필요</div><div class="v" id="mReview"></div></div>
    </div>
    <details><summary>원본 판단값 JSON</summary><pre id="raw"></pre></details>
  </section>
</main>

<script>
const LABEL_KO = { verified: "검증됨", contradicted: "반박됨", unsupported: "근거없음", fabricated: "조문없음" };
const STEP_OF = { generate: "generate", generated: "generate", fetch: "fetch", fetched: "fetch", judge: "judge", judged: "judge" };
let mode = "generate";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b === btn));
    $("answerWrap").hidden = mode !== "extract";
    $("answerText").required = mode === "extract";
    $("modeHint").textContent = mode === "extract"
      ? "붙여 넣은 답변에서 주장과 인용 조문만 추출해 Jev로 검증합니다. 답변은 바꾸지 않습니다."
      : "GPT가 답변을 생성한 뒤, 인용 조문을 조회해 Jev로 검증합니다.";
  });
});

function setStep(name, detail) {
  const step = STEP_OF[name];
  document.querySelectorAll(".steps li").forEach((li) => {
    const order = ["generate", "fetch", "judge"];
    const idx = order.indexOf(li.dataset.step), cur = order.indexOf(step);
    li.classList.toggle("done", idx < cur || (idx === cur && name.endsWith("d")));
    li.classList.toggle("active", idx === cur && !name.endsWith("d"));
  });
  const li = document.querySelector(`.steps li[data-step="${step}"] .label`);
  if (name === "generate") li.textContent = detail.mode === "extract" ? "GPT가 주장을 추출하는 중" : "GPT가 답변을 생성하는 중";
  if (name === "generated") li.textContent = `답변 준비 완료 · 주장 ${detail.claims}개`;
  if (name === "fetch") li.textContent = "legalize로 인용 조문 조회 중";
  if (name === "fetched") li.textContent = `조문 조회 완료 · ${detail.found}/${detail.total}개 존재`;
  if (name === "judge") li.textContent = `Jev가 주장 ${detail.claims}개를 검증하는 중`;
  if (name === "judged") li.textContent = "Jev 검증 완료";
}

function render(r) {
  $("grade").textContent = r.grade; $("grade").className = "grade " + r.grade;
  $("rQuestion").textContent = r.question;
  $("rAnswer").textContent = r.answer;
  $("rows").innerHTML = r.claims.map((c, i) => {
    const v = c.verdict, j = c.judgment, s = c.source;
    const cite = `${esc(c.claim.law)} ${esc(c.claim.article)}` +
      (s ? `<div class="cite">${esc(s.version_date)} 기준 · <a href="${esc(s.source_url)}" target="_blank" rel="noopener">law.go.kr</a></div>` : `<div class="cite">조문을 찾을 수 없음</div>`);
    const conf = v.confidence == null ? "-" : v.confidence.toFixed(2);
    const over = j == null ? "-" : j.overclaim.toFixed(2) + (v.overclaim ? " ⚠" : "");
    const proc = v.needs_review ? `<span class="badge review">사람 검토</span>` : `<span class="badge auto">자동</span>`;
    return `<tr><td>${i + 1}</td><td>${esc(c.claim.text)}</td><td>${cite}</td><td><span class="badge ${v.label}">${LABEL_KO[v.label]}</span></td><td>${conf}</td><td>${over}</td><td>${proc}</td></tr>`;
  }).join("");
  $("mAnswered").textContent = r.answer_judgment.answers_question.toFixed(2);
  $("mTone").textContent = r.answer_judgment.definitive_tone.toFixed(2);
  $("mReview").textContent = r.claims.filter((c) => c.verdict.needs_review).length + " / " + r.claims.length;
  $("raw").textContent = JSON.stringify(r, null, 2);
  $("result").style.display = "block";
}

async function verify(payload) {
  const res = await fetch("/api/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  if (!res.ok) throw new Error(`서버 오류 ${res.status}: ${await res.text()}`);
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      const d = data ? JSON.parse(data) : {};
      if (event === "stage") setStep(d.name, d);
      else if (event === "result") render(d);
      else if (event === "error") throw new Error(d.message);
    }
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("question").value.trim();
  const answerText = $("answerText").value.trim();
  if (!question || (mode === "extract" && !answerText)) return;
  $("submit").disabled = true;
  $("error").style.display = "none"; $("result").style.display = "none";
  $("progress").style.display = "block";
  const defaults = { generate: "답변 준비", fetch: "인용 조문 조회", judge: "Jev 검증" };
  document.querySelectorAll(".steps li").forEach((li) => { li.className = ""; li.querySelector(".label").textContent = defaults[li.dataset.step]; });
  try {
    await verify(mode === "extract" ? { question, answer_text: answerText } : { question });
  } catch (err) {
    $("error").textContent = err.message; $("error").style.display = "block";
  } finally {
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
